{% extends "base.html" %}
{% block title %}Reset password · FluxCRM{% endblock %}
{% block content %}
  <h1>Reset password</h1>
  {% if throttled %}
    <p role="alert">Too many reset requests. Wait and try again.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Send reset link</button>
  </form>
{% endblock %}
