{% extends "base.html" %}
{% block body_class %}page-auth{% endblock %}
{% block content %}
  <h1>Choose a new password</h1>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Change password</button>
    </form>
  {% else %}
    <p role="alert">This reset link is invalid or has expired.</p>
  {% endif %}
{% endblock %}
