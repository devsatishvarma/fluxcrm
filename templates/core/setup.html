{% extends "base.html" %}
{% block title %}Setup · FluxCRM{% endblock %}
{% block content %}
  <h1>FluxCRM</h1>
  <p>Create the company profile and the first administrator. There is no default password.</p>
  <form method="post" enctype="multipart/form-data" class="row g-3">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="col-12">
      <button class="btn btn-primary" type="submit">Create administrator</button>
    </div>
  </form>
{% endblock %}
