{% extends "base.html" %}
{% block title %}Log in · FluxCRM{% endblock %}
{% block content %}
  <h1>FluxCRM</h1>
  <h2>Log in</h2>
  {% if throttled %}
    <p role="alert">Too many sign-in attempts. Wait and try again.</p>
  {% endif %}
  <form method="post" class="col-lg-6">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="mt-3"><a href="{% url 'core:password_reset' %}">Reset password</a></p>
{% endblock %}
