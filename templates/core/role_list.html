{% extends "base.html" %}
{% block title %}Roles · GlideCRM{% endblock %}
{% block content %}
  {% include "core/_settings_nav.html" %}
  <h1>Roles</h1>
  <table class="table">
    <caption>Role grants</caption>
    <thead>
      <tr>
        <th scope="col">Role</th>
        <th scope="col">Scope</th>
        <th scope="col">Grant version</th>
      </tr>
    </thead>
    <tbody>
      {% for role in roles %}
        <tr>
          <td><a href="{% url 'core:role_edit' role.pk %}">{{ role.name }}</a></td>
          <td>{{ role.scope_policy }}</td>
          <td>{{ role.grants_version }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
