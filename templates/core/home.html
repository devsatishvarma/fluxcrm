{% extends "base.html" %}
{% block title %}Home · FluxCRM{% endblock %}
{% block content %}
  <h1>FluxCRM</h1>
  {% if company %}
    <p>{{ company.display_name }}</p>
    <p>{{ company.legal_name }}</p>
  {% endif %}
  <p>Local time: <time datetime="{{ local_now|date:'c' }}">{{ local_now|date:"Y-m-d H:i" }}</time> {{ timezone_name }}</p>
{% endblock %}
