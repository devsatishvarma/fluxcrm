{% extends "base.html" %}
{% block title %}Add account · FluxCRM{% endblock %}
{% block content %}
  <h1>Add account</h1>
  {% if errors %}
    <p role="alert">
      {% for field, messages in errors.items %}{{ field }}: {{ messages|join:", " }} {% endfor %}
    </p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="account-name">Name</label>
        <input class="form-control" id="account-name" name="name" value="{{ posted.name }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="account-type">Type</label>
        <select class="form-select" id="account-type" name="account_type" required>
          {% for key, label in types %}
            <option value="{{ key }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="account-website">Website</label>
        <input class="form-control" id="account-website" name="website_url" value="{{ posted.website_url }}">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="account-phone">Phone</label>
        <input class="form-control" id="account-phone" name="phone" value="{{ posted.phone }}">
      </div>
    </div>
    <button class="btn btn-primary mt-3" type="submit">Save</button>
  </form>
{% endblock %}
