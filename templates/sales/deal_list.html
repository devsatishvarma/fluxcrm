{% extends "base.html" %}
{% block title %}Deals · FluxCRM{% endblock %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="mb-0">Deals</h1>
    <a class="btn btn-primary" href="{% url 'sales:create' %}">Add deal</a>
  </div>
  <form
    class="row g-2 align-items-end mb-3"
    method="get"
    hx-get="{% url 'sales:list' %}"
    hx-target="#deal-results"
    hx-push-url="true"
  >
    <div class="col-md-4">
      <label class="form-label" for="deal-q">Search</label>
      <input class="form-control" id="deal-q" name="q" value="{{ query.q }}">
    </div>
    <div class="col-md-2">
      <label class="form-label" for="deal-stage">Stage</label>
      <input class="form-control" id="deal-stage" name="stage" value="{{ query.stage }}">
    </div>
    <div class="col-md-2">
      <button class="btn btn-outline-primary" type="submit">Filter</button>
    </div>
  </form>
  <div id="deal-results">
    {% include "sales/_deal_results.html" %}
  </div>
{% endblock %}
