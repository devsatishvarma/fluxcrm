{% extends "base.html" %}
{% load crm %}
{% block title %}Deals · FluxCRM{% endblock %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="mb-0">Deals</h1>
    <p class="mb-0">
      Open pipeline: {{ open_total|money }}
      <a href="{% url 'sales:board' %}">Board</a>
      <a class="btn btn-primary" href="{% url 'sales:create' %}">Add deal</a>
    </p>
  </div>
  <form
    class="row g-2 align-items-end mb-3"
    method="get"
    hx-get="{% url 'sales:list' %}"
    hx-target="#deal-results"
    hx-push-url="true"
  >
    <div class="col-md-4">
      <label class="form-label" for="deal-q">Search</label>
      <input class="form-control" id="deal-q" name="q" value="{{ query.q }}">
    </div>
    <div class="col-md-2">
      <label class="form-label" for="deal-stage">Stage</label>
      <select class="form-select" id="deal-stage" name="stage">
        {% for key, label in stage_choices %}
          <option value="{{ key }}"{% if query.stage == key %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label" for="deal-type">Type</label>
      <select class="form-select" id="deal-type" name="deal_type">
        {% for key, label in type_choices %}
          <option value="{{ key }}"{% if query.deal_type == key %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label" for="deal-confidence">Deal confidence</label>
      <select class="form-select" id="deal-confidence" name="confidence">
        {% for key, label in confidence_choices %}
          <option value="{{ key }}"{% if query.confidence == key %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    {% if owner_choices %}
      <div class="col-md-2">
        <label class="form-label" for="deal-owner">Owner</label>
        <select class="form-select" id="deal-owner" name="owner">
          <option value="">All owners</option>
          {% for owner in owner_choices %}
            <option value="{{ owner.pk }}"{% if query.owner == owner.pk|stringformat:"s" %} selected{% endif %}>{{ owner.display_name }}</option>
          {% endfor %}
        </select>
      </div>
    {% endif %}
    <div class="col-md-2">
      <label class="form-label" for="deal-close-after">Close after</label>
      <input class="form-control" id="deal-close-after" name="close_after" type="date" value="{{ query.close_after }}">
    </div>
    <div class="col-md-2">
      <label class="form-label" for="deal-close-before">Close before</label>
      <input class="form-control" id="deal-close-before" name="close_before" type="date" value="{{ query.close_before }}">
    </div>
    <div class="col-md-3">
      <label class="form-label" for="deal-sort">Sort</label>
      <select class="form-select" id="deal-sort" name="ordering">
        <option value="-created_at"{% if query.ordering == "-created_at" or not query.ordering %} selected{% endif %}>Age, newest</option>
        <option value="created_at"{% if query.ordering == "created_at" %} selected{% endif %}>Age, oldest</option>
        <option value="-amount"{% if query.ordering == "-amount" %} selected{% endif %}>Amount, high to low</option>
        <option value="amount"{% if query.ordering == "amount" %} selected{% endif %}>Amount, low to high</option>
        <option value="stage"{% if query.ordering == "stage" %} selected{% endif %}>Stage</option>
        <option value="confidence"{% if query.ordering == "confidence" %} selected{% endif %}>Confidence</option>
        <option value="expected_close_date"{% if query.ordering == "expected_close_date" %} selected{% endif %}>Expected close</option>
        <option value="owner"{% if query.ordering == "owner" %} selected{% endif %}>Owner</option>
      </select>
    </div>
    <div class="col-md-2">
      <button class="btn btn-outline-primary" type="submit">Filter</button>
    </div>
  </form>
  <div id="deal-results">
    {% include "sales/_deal_results.html" %}
  </div>
{% endblock %}
