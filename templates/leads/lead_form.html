{% extends "base.html" %}
{% block title %}{% if lead %}Edit lead{% else %}Add lead{% endif %} · GlideCRM{% endblock %}
{% block content %}
  <h1>{% if lead %}Edit lead{% else %}Add lead{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {% include "crm/_form_fields.html" %}
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Save lead</button>
      {% if lead %}<a href="{% url 'leads:detail' lead.pk %}">Cancel</a>{% endif %}
    </div>
  </form>
{% endblock %}
