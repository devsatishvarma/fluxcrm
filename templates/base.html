<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FluxCRM{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <style>
      .detail-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem 2rem;
        margin-bottom: 1.5rem;
      }
      .detail-fields div {
        display: grid;
        grid-template-columns: 8.5rem minmax(0, 1fr);
        gap: 0.25rem 0.75rem;
        align-items: baseline;
      }
      .detail-fields dt { margin: 0; color: #495057; }
      .detail-fields dd { margin: 0; }
      @media (max-width: 767.98px) {
        .detail-fields { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
      <nav class="container" aria-label="Primary">
        <a class="navbar-brand" href="{% url 'core:home' %}">FluxCRM</a>
        {% if user.is_authenticated %}
            <ul class="navbar-nav me-auto flex-wrap">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'leads:list' %}">Leads</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'accounts:list' %}">Accounts</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'accounts:contacts' %}">Contacts</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'sales:list' %}">Deals</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'activities:tasks' %}">Tasks</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'core:settings' %}">Settings</a>
            </li>
          </ul>
          <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-secondary btn-sm" href="{% url 'core:help' %}">Help</a>
            <form method="post" action="{% url 'core:logout' %}">
              {% csrf_token %}
              <button class="btn btn-outline-secondary btn-sm" type="submit">Log out</button>
            </form>
          </div>
        {% endif %}
      </nav>
    </header>
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
    <script>
      document.addEventListener("keydown", function (event) {
        if (event.key !== "a" && event.key !== "A") return;
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        var target = event.target;
        var tag = target && target.tagName;
        if (
          tag === "INPUT" ||
          tag === "TEXTAREA" ||
          tag === "SELECT" ||
          (target && target.isContentEditable)
        ) {
          return;
        }
        var form = document.getElementById("quick-activity");
        if (!form) return;
        event.preventDefault();
        var subject = form.querySelector("[name=subject]");
        if (subject) subject.focus();
      });
    </script>
  </body>
</html>
