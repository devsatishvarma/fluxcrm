name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ci-only-secret-key-never-use-in-production
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DJANGO_SECURE_COOKIES: "false"
  MYSQL_DATABASE: fluxcrm
  MYSQL_USER: fluxcrm
  MYSQL_PASSWORD: fluxcrm-ci-password
  MYSQL_ROOT_PASSWORD: fluxcrm-ci-root-password
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fluxcrm
          MYSQL_USER: fluxcrm
          MYSQL_PASSWORD: fluxcrm-ci-password
          MYSQL_ROOT_PASSWORD: fluxcrm-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot
          -pfluxcrm-ci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install MySQL build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check Django configuration
        run: uv run python manage.py check
      - name: Check migration drift
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Apply clean-database migrations
        run: uv run python manage.py migrate --noinput
      - name: Run tests
        env:
          MYSQL_USER: root
          MYSQL_PASSWORD: fluxcrm-ci-root-password
        run: uv run pytest --cov=. --cov-report=term-missing

  browser-smoke:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fluxcrm
          MYSQL_USER: fluxcrm
          MYSQL_PASSWORD: fluxcrm-ci-password
          MYSQL_ROOT_PASSWORD: fluxcrm-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot
          -pfluxcrm-ci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
          uv sync --frozen
          uv run playwright install --with-deps chromium
      - name: Start application
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py runserver 127.0.0.1:8000 --noreload &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ready/ && break
            if [[ "${attempt}" == "30" ]]; then exit 1; fi
            sleep 1
          done
      - name: Run browser smoke tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: uv run pytest -o addopts="" -m browser tests/browser
