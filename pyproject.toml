[project]
name = "glidecrm"
version = "0.1.0"
description = "Self-hosted CRM for Infoshare Systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.10,<6.1",
    "django-htmx>=1.27,<2",
    "djangorestframework>=3.16,<4",
    "gunicorn>=23,<24",
    "mysqlclient>=2.2.7,<3",
    "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "playwright>=1.55,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "pytest-django>=4.11,<5",
    "pytest-playwright>=0.7,<1",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "glidecrm.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --ignore=tests/browser"
markers = [
    "browser: end-to-end tests that require a running server and Playwright",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
quote-style = "double"
