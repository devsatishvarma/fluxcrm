[project]
name = "fluxcrm"
version = "0.1.0"
description = "Self-hosted CRM for Infoshare Systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.8.1",
    "agent-framework-openai>=1.8.1",
    "agno[mcp]>=2.6.14",
    "deepagents>=0.6.8",
    "django>=6.0,<6.1",
    "django-htmx>=1.27,<2",
    "djangorestframework>=3.16,<4",
    "fastapi>=0.136.1",
    "google-adk[a2a,mcp]>=2.2.0",
    "gradio>=6.14.0",
    "gunicorn>=23,<24",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "massive>=2.8.0",
    "mysqlclient>=2.2.7,<3",
    "openai>=2.34.0",
    "openai-agents[viz]>=0.15.1",
    "plotly>=6.8.0",
    "pydantic>=2.13.3",
    "pydantic-ai-slim[mcp,openai]>=1.107.0",
    "pypdf>=6.10.2",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "requests>=2.33.1",
    "rich>=15.0.0",
    "strands-agents[openai]>=1.43.0",
    "uvicorn[standard]>=0.46.0",
    "wikipedia>=1.4.0",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "playwright>=1.55,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "pytest-django>=4.11,<5",
    "pytest-playwright>=0.7,<1",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fluxcrm.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --ignore=tests/browser"
markers = [
    "browser: end-to-end tests that require a running server and Playwright",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
quote-style = "double"
